<script>
var soundOn = true;
var audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, time, dur, type){
  if(!soundOn) return;
  try{
    var ctx = getCtx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + time);
    o.stop(ctx.currentTime + time + dur);
  }catch(e){}
}
function playClick(){ beep(600, 0, 0.08, 'sine'); }
function playCorrect(){
  beep(523, 0, 0.15, 'sine');
  beep(659, 0.15, 0.15, 'sine');
  beep(784, 0.30, 0.3, 'sine');
  beep(1046, 0.60, 0.4, 'triangle');
}
function playWrong(){
  beep(200, 0, 0.25, 'sawtooth');
  beep(150, 0.15, 0.3, 'sawtooth');
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').innerText = soundOn ? '🔊' : '🔇';
  if(soundOn) playClick();
}
</script>
